<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>Browse Minigames</title>
  </head>
  <body>
    <!-- Top Header with Logo and Search -->
    <header class="browse-header">
        <div class="header-top">
            <a href="/index.html">
                <img src="/src/assets/LogoMiddle.svg" alt="Home" class="small-logo" />
            </a>
            <button id="theme-toggle">☀️ Light Mode</button>
        </div>
        <input type="text" id="search-input" placeholder="Search for a game..." />

    <!-- The container where the game cards will be injected -->
    <main class="games-grid" id="games-container">
      <!-- Cards go here via JS -->
    </main>

    <script type="module" src="/src/browse.js"></script>
  </body>
</html>
